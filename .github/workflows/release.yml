name: Build & Release Legacy PSCam Sensor

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run Test Suite
        run: |
          python -u test_suite.py

      - name: Build Standalone Executable (--onefile with Splash)
        run: |
          pyinstaller --noconfirm legacy_pscam_sensor.spec

      - name: Build Fast-Launch Portable Folder (--onedir ZIP)
        shell: pwsh
        run: |
          $env:LEGACY_BUILD_MODE = "onedir"
          pyinstaller --noconfirm legacy_pscam_sensor.spec
          Compress-Archive -Path "dist/LegacyPSCam/*" -DestinationPath "dist/LegacyPSCam-Portable-Windows.zip" -Force

      - name: Set Release Metadata
        shell: pwsh
        run: |
          $ver = python -c "from version import __version__; print(__version__)"
          echo "APP_VER=v$ver" >> $env:GITHUB_ENV

      - name: Upload Artifact (Accessible on all workflow runs)
        uses: actions/upload-artifact@v4
        with:
          name: LegacyPSCam-Windows
          path: |
            dist/LegacyPSCam.exe
            dist/LegacyPSCam-Portable-Windows.zip
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LegacyPSCam.exe
            dist/LegacyPSCam-Portable-Windows.zip
          name: Legacy PSCam Sensor ${{ env.APP_VER }} (Alpha)
          body: ""
          generate_release_notes: false
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
