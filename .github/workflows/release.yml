name: Build & Release Legacy PSCam Sensor

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run Test Suite
        run: |
          python -u test_suite.py

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm legacy_pscam_sensor.spec

      - name: Package Standalone Release (.zip)
        shell: pwsh
        run: |
          $ver = python -c "from version import __version__; print(__version__)"
          $zipName = "LegacyPSCam_Sensor-v${ver}.zip"
          Write-Host "Creating release bundle: $zipName"

          New-Item -ItemType Directory -Path "release_staging" -Force
          Copy-Item "dist/LegacyPSCam_Sensor.exe" -Destination "release_staging/"
          Copy-Item -Recurse "Kinect for Legacy DLL" -Destination "release_staging/Kinect for Legacy DLL"

          Compress-Archive -Path "release_staging/*" -DestinationPath $zipName -Force
          Write-Host "Release archive created successfully: $zipName"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          echo "APP_VER=v$ver" >> $env:GITHUB_ENV

      - name: Upload Artifact (Accessible on all workflow runs)
        uses: actions/upload-artifact@v4
        with:
          name: LegacyPSCam_Sensor-Windows
          path: release_staging/
          if-no-files-found: error

      - name: Upload Release Archive (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          name: Legacy PSCam Sensor ${{ env.APP_VER }} (Alpha)
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
